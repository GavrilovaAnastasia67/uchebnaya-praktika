<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Самостоятельная работа DOM</title>
    <script src="js/dom.js" defer></script>
    <style>
        .course-box {
            border: 2px solid #2b579a;
            background-color: #f4f7fb;
            padding: 20px;
            border-radius: 8px;
            max-width: 450px;
            margin-top: 30px;
            font-family: Arial, sans-serif;
        }
        .done-message {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="course-info" class="course-box">
        <h2>Информация о курсе</h2>
        <p id="course-name"></p>
        <p id="student-fio"></p>
        <p id="group-num"></p>
        <p id="topics-count"></p>
        <p id="final-msg"></p>
    </div>

    <script>
        const courseName = 'Основы веб-разработки и JavaScript';
        const studentFio = 'Гаврилова Анастасия';
        const groupNum = 'ИС-1-25';
        const topicsCount = 12;

        document.querySelector('#course-name').textContent = `Дисциплина: ${courseName}`;
        document.querySelector('#student-fio').textContent = `Студент: ${studentFio}`;
        document.querySelector('#group-num').textContent = `Группа: ${groupNum}`;
        document.querySelector('#topics-count').textContent = `Изучено тем JavaScript: ${topicsCount}`;

        const finalMsg = document.querySelector('#final-msg');
        finalMsg.textContent = 'Практическая работа завершена';
        finalMsg.classList.add('done-message');
    </script>
</body>
</html>
